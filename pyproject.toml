[project]
name = "incident-finder-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.0",
    "langgraph>=1.2.16",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
incident-finder-api = "src:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
    "typing-extensions>=4.16.0",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
